# PNPM workspace for packages/ and plasmicpkgs/
packages:
  - packages/*
  # Deprecated stub packages with no version
  - "!packages/loader-angular"
  - "!packages/loader-svelte"
  - "!packages/loader-vue"
  - "!packages/plasmic"
  - plasmicpkgs/*
  - plasmicpkgs/commerce-providers/*
  - plasmicpkgs-dev

# Shared direct and toolchain dependencies. Keep compatibility ranges in
# peerDependencies; pnpm replaces catalog references when packing/publishing.
catalog:
  "@babel/core": "^7.29.0"
  "@babel/generator": "^7.29.8"
  "@babel/helpers": "^7.29.0"
  "@babel/parser": "^7.29.8"
  "@babel/preset-env": "^7.29.2"
  "@babel/preset-react": "^7.28.5"
  "@babel/preset-typescript": "^7.28.5"
  "@babel/traverse": "^7.29.8"
  "@babel/types": "^7.29.8"
  "@react-awesome-query-builder/core": "^6.6.15"
  "@storybook/addon-essentials": "8.5.5"
  "@storybook/addon-interactions": "8.5.5"
  "@storybook/addon-links": "8.5.5"
  "@storybook/blocks": "8.5.5"
  "@storybook/channels": "8.5.5"
  "@storybook/components": "8.5.5"
  "@storybook/core-events": "8.5.5"
  "@storybook/manager-api": "8.5.5"
  "@storybook/preview-api": "8.5.5"
  "@storybook/react": "8.5.5"
  "@storybook/react-webpack5": "8.5.5"
  "@storybook/test": "8.5.5"
  "@storybook/theming": "8.5.5"
  "@testing-library/react": "16.2.0"
  "@types/debounce": "^1.2.4"
  "@types/dlv": "^1.1.5"
  "@types/findup-sync": "^2.0.2"
  "@types/glob": "^7.2.0"
  "@types/js-cookie": "^3.0.6"
  "@types/lodash": "^4.17.25"
  "@types/minimatch": "3.0.5"
  "@types/react": "18.3.27"
  "@types/react-dom": "18.3.7"
  "@types/semver": "^7.8.0"
  "@vitest/coverage-v8": "4.1.10"
  dayjs: "1.11.23"
  eslint: "^8.55.0"
  jest: "29.7.0"
  lottie-web: ">=5.13.0"
  picomatch: "2.3.1"
  playwright: "1.60.0"
  playwright-core: "1.60.0"
  react: "18.3.1"
  react-dom: "18.3.1"
  rollup-plugin-dts: "^5.3.0"
  rollup-plugin-esbuild: "^5.0.0"
  rollup-plugin-replace-imports: "^1.0.0"
  rollup-plugin-typescript2: "^0.37.0"
  sha.js: "^2.4.12"
  storybook: "8.5.5"
  tsdx: "^0.14.1"
  tslib: "^2.6.2"
  tsup: "^7.2.0"
  tsx: "^4.23.11"
  typescript: "5.2.2"
  vite: "8.1.5"
  vitest: "4.1.10"

# Named catalogs cover the few packages that intentionally need two versions.
catalogs:
  antd5:
    antd: "5.12.8"
  typescript-json-schema:
    typescript: "5.9.3"

overrides:
  eslint: "catalog:"
  jest: "catalog:"
  # Pins before releases that don't work for us
  sha.js: "catalog:"
  "@babel/helpers": "catalog:"
  "@types/minimatch": "catalog:"
  typescript: "catalog:"
  # typescript-json-schema bundles its compiler and pins to typescript ~5.9.3.
  # The repo-wide typescript override above otherwise forces a resolution
  # outside that range.
  "typescript-json-schema>typescript": "catalog:typescript-json-schema"
  dayjs: "catalog:"
  "picomatch@2": "catalog:"
  "antd@5": "catalog:antd5"
  "lottie-web": "catalog:"
  # storybook-addon-mock@5 declares its @storybook/* shim deps as ^8.0.8, which a
  # fresh pnpm resolve bumps to 8.6.x while we pin storybook core at 8.5.5. The
  # 8.6.x shims import "storybook/internal/csf", a subpath storybook@8.5.5 does
  # not export, breaking the storybook build. Pin the shims to match core.
  "@storybook/blocks": "catalog:"
  "@storybook/channels": "catalog:"
  "@storybook/components": "catalog:"
  "@storybook/core-events": "catalog:"
  "@storybook/manager-api": "catalog:"
  "@storybook/preview-api": "catalog:"
  "@storybook/theming": "catalog:"
  # Only pulled in transitively (@storybook/test-runner, jest-playwright-preset),
  # both with open ranges, so this would otherwise float to whatever is latest at
  # resolve time. Pin it to the version platform/wab, platform/wab/playwright
  # and platform/loader-tests use, so the runner image only pre-installs one set
  # of browsers (devops/manual/runner-image).
  playwright: "catalog:"
  playwright-core: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: false
  gatsby: true
  gatsby-cli: true
  lmdb: true
  # only used in Gatsby loader, fall back to JS decoder instead of compiling from scratch
  msgpackr-extract: false
  msw: true
  nx: true
  # dev-only transitive (gatsby-sharp, next), don't build in CI/CD
  sharp: false
  unrs-resolver: true

shamefullyHoist: true
# Link local workspace packages even when referenced by plain version range.
linkWorkspacePackages: deep
preferWorkspacePackages: true
