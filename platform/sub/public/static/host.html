<!DOCTYPE html>
<html>
  <head>
    <script>
      if (typeof window !== "undefined") {
        if (window.parent !== window) {
          try {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
              window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          } catch (err) {}
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const renderers = new Map();
          let lastRendererId = 0;
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            supportsFiber: true,
            renderers,
            inject: (renderer) => {
              // Canvas frames share this hook, and Studio removes their
              // renderers when it disposes them, so ids can't be based on
              // renderers.size. Return the id like React DevTools does, so
              // that each renderer reports commits under its own id.
              renderers.set(++lastRendererId, renderer);
              return lastRendererId;
            },
            onCommitFiberRoot: function () {},
            onCommitFiberUnmount: function () {},
          };
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion) {
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion = "1";
        }
      }
    </script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="app-root"></div>
    <script src="/static/sub/build/client.<%= commitHash %>.js"></script>
  </body>
</html>
