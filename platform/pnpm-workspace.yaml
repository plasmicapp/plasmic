patchedDependencies:
  # Versionless key on purpose: apply to ANY resolved teeny-request version so a
  # transitive upgrade (e.g. to v10) can't silently drop the patch. If a future
  # version changes build/src/agents.js enough that the hunk no longer applies,
  # `pnpm install` fails loudly instead of regressing.
  teeny-request: patches/teeny-request.patch
  # Migrated from wab/patches and loader-bundle-env/patches (patch-package
  # format). Version-pinned keys paired with the overrides above so the patch
  # always targets the exact resolved version.
  passport-oauth2@1.8.0: patches/passport-oauth2.patch
  "@octokit/app@16.1.2": patches/@octokit__app.patch
  "@octokit/auth-unauthenticated@7.0.3": patches/@octokit__auth-unauthenticated.patch
  "@octokit/webhooks-methods@6.0.0": patches/@octokit__webhooks-methods.patch
  "@react-aria/focus@3.20.3": patches/@react-aria__focus.patch
  "@react-aria/overlays@3.27.1": patches/@react-aria__overlays.patch
  react-slick@0.28.1: patches/react-slick.patch
  # Version-pinned to wab's exact "history" dependency. Not added to overrides:
  # other importers may resolve history@4 transitively and must stay untouched.
  history@5.3.0: patches/history.patch

# Which dependencies may run install/build scripts. Explicit true/false for
# every package pnpm flagged during the yarn -> pnpm migration so `pnpm install`
# never re-prompts. Native addons that must compile/link -> true; packages whose
# only "build" is a donation notice or an unused artifact -> false.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  protobufjs: true
  sharp: true
  "@fortawesome/fontawesome-common-types": false
  "@fortawesome/fontawesome-free": false
  "@fortawesome/fontawesome-svg-core": false
  "@fortawesome/free-regular-svg-icons": false
  "@fortawesome/free-solid-svg-icons": false
  "@pankod/refine-core": false
  aws-sdk: false
  core-js: false
  core-js-pure: false
  msw: false
