# Own pnpm root shared by wab, canvas-packages, loader-bundle-env and
# loader-html-hydrate (see platform/wab/Dockerfile). loader-bundle-env's
# internal_pkgs/* are pulled in via workspace:* deps in loader-bundle-env's
# package.json.
#
# Reconstructed: this file (and platform/package.json, platform/pnpm-lock.yaml)
# was missing from the repo entirely, even though every sibling
# platform/*/pnpm-workspace.yaml references it and platform/wab/Dockerfile
# copies it as a build input. If you're upgrading a dependency that canvas-packages'
# package.json says is "pinned via the workspace-wide override" (e.g.
# @react-aria/focus, @react-aria/overlays), that override did not survive
# reconstruction — check canvas-packages/package.json's dependenciesComments
# and pin explicitly there instead.
packages:
  - wab
  - canvas-packages
  - loader-bundle-env
  - loader-bundle-env/internal_pkgs/*
  - loader-html-hydrate
# True for wab's own direct, pinned dependencies (bcrypt, aws-sdk, the
# @fortawesome/* icon packages) and for names the root pnpm-workspace.yaml
# already allows (@parcel/watcher, @swc/core, core-js(-pure), sharp). False
# (pnpm's default) for esbuild, matching root, and for protobufjs, which is
# only a transitive dep here and unreviewed.
allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-free': true
  '@fortawesome/fontawesome-svg-core': true
  '@fortawesome/free-regular-svg-icons': true
  '@fortawesome/free-solid-svg-icons': true
  '@parcel/watcher': true
  '@swc/core': true
  aws-sdk: true
  bcrypt: true
  core-js: true
  core-js-pure: true
  esbuild: false
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
