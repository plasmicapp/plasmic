packages:
  - analytics-rproxy
  - mini-cache
  - wab
  - canvas-packages
  - loader-bundle-env
  - loader-bundle-env/internal_pkgs/*
  - loader-html-hydrate

injectWorkspacePackages: true

# upgrade-internal installs @plasmicapp/* and @plasmicpkgs/* minutes after the release
# pipeline publishes them, so pnpm's 24h default quarantine fails every release.
minimumReleaseAge: 0

catalog:
  "@nats-io/jetstream": 3.3.1
  "@nats-io/kv": 3.3.1
  "@nats-io/nats-core": 3.3.1
  "@nats-io/transport-node": 3.3.1

# Merged from the per-package "resolutions" of wab, canvas-packages and
# loader-bundle-env. pnpm overrides are workspace-global, so where
# canvas-packages and loader-bundle-env disagreed on the legacy antd v4 pin
# (4.19.5 vs 4.19.3) we unify on the newer 4.19.5. The trailing block pins the
# packages that carry version-specific patches (see patchedDependencies) so a
# fresh resolve can't drift off the patched version and silently drop the fix.
#
# NB: the @react-aria/focus and @react-aria/overlays pins unify canvas-packages
# DOWN from 3.21.5/3.31.2 (a routine bump in #2660) to the versions wab's
# patches target, since per-importer versions of transitive deps aren't
# expressible with pnpm overrides. canvas-packages' package.json declares the
# same pins so the manifest matches what actually installs. If these are ever
# upgraded, rebase patches/@react-aria__*.patch onto the new dist output.
overrides:
  react-aria-components: 1.9.0
  sha.js: ^2.4.12
  retry-request: ^8.0.2
  # vitest allows vite 6-8; pin it to the vite wab already declares, so the
  # workspace keeps a single vite copy.
  "vitest>vite": ^6.4.2
  "@plasmicpkgs/antd>antd": 4.19.5
  "@plasmicpkgs/react-slick>antd": 4.19.5
  "@plasmicpkgs/antd5>antd": 5.12.8
  "@ant-design/pro-components>antd": 5.12.8
  "@ant-design/pro-table>antd": 5.12.8
  "@ant-design/pro-list>antd": 5.12.8
  # antd 5 was frozen at 5.12.5 (loader-bundle-env) / 5.12.8 (canvas-packages);
  # a fresh resolve floats to 5.29.x whose Table renders an extra leading
  # column, breaking RichTable. Also pins wab's ^5.12.7 to the same copy.
  "antd@^5": 5.12.8
  rc-util: ^5.44.4
  lottie-web: ">=5.13.0"
  passport-oauth2: 1.8.0
  "@octokit/app": 16.1.2
  "@octokit/auth-unauthenticated": 7.0.3
  "@octokit/webhooks-methods": 6.0.0
  "@react-aria/focus": 3.20.3
  "@react-aria/overlays": 3.27.1
  react-slick: 0.28.1
  # Type-bearing transitives that wab's old yarn.lock had frozen at older
  # versions; a fresh resolve drifts them and breaks wab's typecheck
  # (AriaPositionProps.placement, underscore.string named imports). Pinned to
  # the yarn-frozen versions; direct pins can't reach these because pnpm
  # resolves each dependent's copy independently.
  "@react-types/overlays": 3.8.15
  "@react-types/shared": 3.32.1
  "@types/underscore": 1.10.24
  # One @types/react identity across the graph. Transitives declaring
  # @types/react@* would otherwise resolve a second, newer copy, and every
  # JSX prop bag crossing the two copies fails to typecheck.
  "@types/react@^18": 18.3.18
  "@types/react-dom@^18": 18.3.5
  # Unify the 4.x express types on the version wab's yarn.lock had frozen;
  # otherwise @types/express resolves its own newer copy and every
  # Request/Response in wab has two incompatible type identities.
  "@types/express-serve-static-core@^4": 4.17.35
  # react-aria, react-stately, tiptap and prosemirror families pinned to the
  # versions wab's and loader-bundle-env's yarn.locks had frozen (wab's where
  # they disagreed on patch level). A fresh resolve floated all of them by
  # several minors, which changed loader bundle output (tiptap mention attrs,
  # react-aria popover behavior). canvas-packages moves to the same family,
  # which also makes it consistent with the pinned @react-aria/focus/overlays.
  "@internationalized/date": 3.10.0
  "@internationalized/message": 3.1.8
  "@internationalized/number": 3.6.5
  "@internationalized/string": 3.2.7
  "@react-aria/breadcrumbs": 3.5.24
  "@react-aria/button": 3.13.1
  "@react-aria/calendar": 3.8.1
